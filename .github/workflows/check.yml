name: Fast checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect publication scope and runtime bundle
        run: |
          python scripts/check_public.py
          python scripts/release.py check
      - name: Run offline contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s evals/routing -p 'test_*.py' -v
          python evals/routing/routing.py check
          python evals/routing/routing.py check --profile core
      - name: Build deterministic distribution
        run: python scripts/release.py build --output "${{ runner.temp }}/codex-workflow-kit.zip"
      - name: Check whitespace
        run: git diff --check
